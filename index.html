<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        /* Base page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }

        /* Card container */
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        /* Heading */
        h1 {
            color: #2d3748;
            font-size: 2rem;
            margin-bottom: 16px;
        }

        /* Paragraph */
        p {
            color: #4a5568;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Button */
        button {
            background: #667eea;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        /* Message area for button click */
        .result-message {
            margin-top: 20px;
            font-size: 1rem;
            font-weight: 500;
            color: #2b6cb0;
            min-height: 24px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>My First GitHub Website </h1>
        <p>
            Welcome! This is a simple web page built with pure HTML, CSS, and JavaScript.
            You have successfully taken your first step into web development!
        </p>
        <button id="clickBtn" type="button">Click Me!</button>
        <div id="message" class="result-message"></div>
    </div>

    <script>
        // Simple script to handle button interaction
        const button = document.getElementById('clickBtn');
        const messageDiv = document.getElementById('message');
        let clickCount = 0;

        button.addEventListener('click', function () {
            clickCount++;
            if (clickCount === 1) {
                messageDiv.textContent = '🎉 You have clicked this button 1 time!';
            } else {
                messageDiv.textContent = `🎉 You have clicked this button ${clickCount} times!`;
            }
        });
    </script>

</body>

</html>
